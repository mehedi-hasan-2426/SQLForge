name: Bug report
description: Report a reproducible SQLForge problem.
labels: [bug]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the task and synthetic SQL only. Never include private data.
    validations:
      required: true
  - type: textarea
    id: behaviour
    attributes:
      label: Expected and observed behaviour
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, OS and device
    validations:
      required: true
